# SFamily — websocket host
#
# Install:
#   sudo cp deploy/nginx/ws.sfamily.co.conf /etc/nginx/sites-available/ws.sfamily.co
#   sudo ln -sfn /etc/nginx/sites-available/ws.sfamily.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot install --cert-name ws.sfamily.co
#
# Kept in the repo rather than only on the box so the next server can be
# rebuilt from git instead of from memory.
#
# certbot rewrites this file when it installs the certificate: it adds the
# 443 block, the cert paths and a redirect. Re-copying this file afterwards
# would undo that — edit /etc/nginx/sites-available/ws.sfamily.co directly
# from then on and copy the changes back here.

server {
    listen 80;
    listen [::]:80;
    server_name ws.sfamily.co;

    # Reverb binds to loopback (REVERB_SERVER_HOST=127.0.0.1), so this is the
    # only way in. Port 8080 stays closed in the security group.
    location / {
        proxy_pass http://127.0.0.1:8080;

        # The websocket upgrade. Without http_version 1.1 and these two
        # headers nginx answers the handshake with a plain 200 and the client
        # sits there waiting for a socket that never opens.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat connection is idle most of the time — that is what it is for.
        # At the 60s default nginx closes every quiet socket and the whole
        # user base reconnects in a loop, which looks exactly like a flaky
        # network and is very hard to diagnose from the client side.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Websocket frames are small and already framed; buffering them adds
        # latency to the one thing that is supposed to feel instant.
        proxy_buffering off;
    }
}
