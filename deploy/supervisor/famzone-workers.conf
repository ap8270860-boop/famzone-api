; SFamily — long-running processes
;
; Install:
;   sudo cp deploy/supervisor/famzone-workers.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Before the first install, check two things and edit below if they differ:
;
;   stat -c '%U' /var/www/famzone/storage/logs    -> the `user` value
;   which php                                     -> the php path
;
; Getting `user` wrong is the classic failure: the process starts, cannot
; write to storage/logs, and dies in a restart loop with nothing useful in
; the supervisor log to explain why.


; -----------------------------------------------------------------------------
; The websocket server
; -----------------------------------------------------------------------------
;
; One process only. A second would need REVERB_SCALING_ENABLED=true and Redis
; to share connection state between them, and without that the two would hold
; separate sets of clients — a message published by one would reach half the
; users and nobody would be able to say which half.
;
[program:famzone-reverb]
command=/usr/bin/php /var/www/famzone/artisan reverb:start
directory=/var/www/famzone
user=www-data
numprocs=1
autostart=true
autorestart=true
; Reverb holds live connections; give it a moment to close them cleanly rather
; than dropping thousands of sockets the instant a deploy lands.
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/famzone/reverb.log
redirect_stderr=true
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3


; -----------------------------------------------------------------------------
; Chat broadcasts
; -----------------------------------------------------------------------------
;
; Its own queue, deliberately. A chat message is the most latency-sensitive
; job in the system and one of the cheapest to run — sharing a queue with
; thumbnails or a batch of push notifications would put it behind them, and a
; message that takes eight seconds to appear reads as a broken app.
;
; Two processes so one slow broadcast cannot stall the other.
;
[program:famzone-broadcasts]
command=/usr/bin/php /var/www/famzone/artisan queue:work redis --queue=broadcasts --tries=3 --sleep=1 --max-time=3600
directory=/var/www/famzone
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
; --max-time recycles each worker hourly. PHP was not built for processes that
; live for weeks, and a slow memory creep is easier to prevent than to find.
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/famzone/broadcasts.log
redirect_stderr=true
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3


; -----------------------------------------------------------------------------
; Everything else that queues
; -----------------------------------------------------------------------------
;
; Nothing uses this yet. It is here because the day something does — a push
; notification, an image thumbnail — those jobs would otherwise sit in Redis
; unprocessed with no error anywhere, and that is a genuinely hard problem to
; notice. Cheaper to have an idle worker than to debug silence.
;
[program:famzone-default]
command=/usr/bin/php /var/www/famzone/artisan queue:work redis --queue=default --tries=3 --sleep=3 --max-time=3600
directory=/var/www/famzone
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/famzone/default.log
redirect_stderr=true
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3


; -----------------------------------------------------------------------------
[group:famzone]
programs=famzone-reverb,famzone-broadcasts,famzone-default
